<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Gabriella Braga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f2;
    --card:#ffffff;
    --ink:#111214;
    --ink-soft:#53564f;
    --lime:#c6f24e;
    --lime-ink:#1c2400;
    --line:#e3e4de;
    --erro:#b3261e;
    --erro-bg:#fdecea;
    --ok-bg:#eef7dd;
    --radius:16px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Asap',system-ui,-apple-system,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{ outline:3px solid var(--ink); outline-offset:2px; border-radius:6px; }

  .cartao{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:0 20px 60px rgba(17,18,20,.10);
    padding:36px 32px;
    width:100%;
    max-width:380px;
  }
  .marca{
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  h1{
    font-size:1.35rem;
    margin:10px 0 6px;
    letter-spacing:-.01em;
  }
  .sub{
    margin:0 0 24px;
    font-size:.88rem;
    color:var(--ink-soft);
  }
  label{
    display:block;
    font-size:.8rem;
    font-weight:600;
    margin-bottom:6px;
  }
  input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--bg);
    font-family:inherit;
    font-size:.95rem;
    color:var(--ink);
    margin-bottom:16px;
  }
  input:focus{ outline:3px solid var(--lime); outline-offset:1px; border-color:var(--lime); }

  .botao{
    width:100%;
    padding:13px 18px;
    border:none;
    border-radius:999px;
    background:var(--ink);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:.95rem;
    cursor:pointer;
    transition:background .2s;
  }
  .botao:hover{ background:#2b2c2e; }
  .botao[disabled]{ opacity:.6; cursor:progress; }

  .link-secundario{
    display:block;
    width:100%;
    margin-top:16px;
    background:none;
    border:none;
    font-family:inherit;
    font-size:.82rem;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    text-align:center;
  }
  .link-secundario:hover{ color:var(--ink); }

  .faixa{
    display:none;
    border-radius:10px;
    padding:11px 14px;
    font-size:.85rem;
    font-weight:600;
    margin-bottom:18px;
    line-height:1.4;
  }
  .faixa.aparece{ display:block; }
  .faixa.ruim{ background:var(--erro-bg); color:var(--erro); }
  .faixa.boa{ background:var(--ok-bg); color:var(--lime-ink); }

  .voltar{
    display:block;
    text-align:center;
    margin-top:22px;
    font-size:.8rem;
    color:var(--ink-soft);
    text-decoration:none;
  }
  .voltar:hover{ text-decoration:underline; }

  .carregando{
    text-align:center;
    font-size:.85rem;
    color:var(--ink-soft);
  }
</style>
</head>
<body>

<main class="cartao" id="cartao" aria-busy="true">
  <p class="carregando" id="carregando">Conferindo se você já está logada...</p>

  <div id="conteudo" hidden>
    <span class="marca">Gabriella Braga</span>
    <h1>Entrar no painel</h1>
    <p class="sub">Área restrita. Use o seu e-mail e a sua senha.</p>

    <div class="faixa" id="faixa" role="alert" aria-live="polite"></div>

    <form id="formEntrar" novalidate>
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>

      <button type="submit" class="botao" id="botaoEntrar">Entrar</button>
    </form>

    <button type="button" class="link-secundario" id="botaoEsqueci">Esqueci minha senha</button>
    <a class="voltar" href="../">Voltar para o meu portfólio</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/banco.js?v=3"></script>
<script>
(function(){
  "use strict";

  var carregando   = document.getElementById("carregando");
  var conteudo     = document.getElementById("conteudo");
  var cartao       = document.getElementById("cartao");
  var faixa        = document.getElementById("faixa");
  var form         = document.getElementById("formEntrar");
  var campoEmail   = document.getElementById("email");
  var campoSenha   = document.getElementById("senha");
  var botaoEntrar  = document.getElementById("botaoEntrar");
  var botaoEsqueci = document.getElementById("botaoEsqueci");

  function mostrarFaixa(texto, tipo){
    faixa.textContent = texto;
    faixa.className = "faixa aparece " + (tipo === "boa" ? "boa" : "ruim");
  }
  function esconderFaixa(){
    faixa.className = "faixa";
    faixa.textContent = "";
  }
  function mostrarFormulario(){
    carregando.hidden = true;
    conteudo.hidden = false;
    cartao.setAttribute("aria-busy", "false");
    campoEmail.focus();
  }

  /* Se a biblioteca do banco nao carregou, avisa em portugues
     em vez de deixar a tela parada para sempre. */
  if (!window.Banco || !window.Banco.cliente){
    mostrarFormulario();
    mostrarFaixa("Não consegui carregar a conexão com o banco. Confira a sua internet e recarregue a página.", "ruim");
    botaoEntrar.disabled = true;
    return;
  }

  /* Ja tem sessao aberta? Vai direto para o painel. */
  window.Banco.sessao().then(function(sessao){
    if (sessao){
      window.location.replace("../admin/");
      return;
    }
    mostrarFormulario();
  });

  form.addEventListener("submit", async function(evento){
    evento.preventDefault();
    esconderFaixa();

    var email = campoEmail.value.trim();
    var senha = campoSenha.value;

    if (!email || !senha){
      mostrarFaixa("Preencha o e-mail e a senha.", "ruim");
      return;
    }

    botaoEntrar.disabled = true;
    botaoEntrar.textContent = "Entrando...";

    try {
      var resposta = await window.Banco.cliente.auth.signInWithPassword({
        email: email,
        password: senha
      });

      if (resposta.error){
        var mensagem = resposta.error.message || "";
        if (/Email not confirmed/i.test(mensagem)){
          mostrarFaixa("Esse e-mail ainda não foi confirmado. Procure o e-mail de confirmação do Supabase na sua caixa de entrada.", "ruim");
        } else if (/rate limit|too many/i.test(mensagem)){
          mostrarFaixa("Muitas tentativas seguidas. Espere um minuto e tente de novo.", "ruim");
        } else {
          mostrarFaixa("E-mail ou senha incorretos", "ruim");
        }
        botaoEntrar.disabled = false;
        botaoEntrar.textContent = "Entrar";
        campoSenha.value = "";
        campoSenha.focus();
        return;
      }

      window.location.replace("../admin/");

    } catch (falha){
      mostrarFaixa("Não consegui falar com o banco agora. Confira a sua internet e tente de novo.", "ruim");
      botaoEntrar.disabled = false;
      botaoEntrar.textContent = "Entrar";
    }
  });

  botaoEsqueci.addEventListener("click", async function(){
    esconderFaixa();
    var email = campoEmail.value.trim();

    if (!email){
      mostrarFaixa("Escreva o seu e-mail no campo acima e clique de novo em esqueci minha senha.", "ruim");
      campoEmail.focus();
      return;
    }

    botaoEsqueci.disabled = true;
    botaoEsqueci.textContent = "Enviando...";

    try {
      var destino = window.location.origin + window.location.pathname.replace(/login\/?$/, "") + "login/";
      var resposta = await window.Banco.cliente.auth.resetPasswordForEmail(email, {
        redirectTo: destino
      });
      if (resposta.error){
        mostrarFaixa("Não consegui enviar o e-mail de recuperação agora. Tente de novo em alguns minutos.", "ruim");
      } else {
        mostrarFaixa("Pronto. Se esse e-mail estiver cadastrado, o link de recuperação chega em instantes. Olhe também o spam.", "boa");
      }
    } catch (falha){
      mostrarFaixa("Não consegui enviar o e-mail de recuperação agora. Tente de novo em alguns minutos.", "ruim");
    }

    botaoEsqueci.disabled = false;
    botaoEsqueci.textContent = "Esqueci minha senha";
  });

})();
</script>
</body>
</html>
